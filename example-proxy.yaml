# Standalone fake-pump proxy: use this instead of example.yaml, on a separate ESP32.
esphome:
  name: alpha2-go-proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server_base:

external_components:
  - source:
      type: local
      path: components

esp32_ble_tracker:

ble_client:
  - mac_address: !secret pump_mac
    id: proxy_pump

alpha2_proxy:
  ble_client_id: proxy_pump
